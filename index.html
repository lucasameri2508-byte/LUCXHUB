<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>LUCXHUB | PS3</title>
<style>
:root{--bg:#0b1220;--panel:#131e30;--panel2:#19273c;--line:#2a3b55;--text:#edf4ff;--muted:#9aacc5;--accent:#36b7a5;--accent2:#68d7c8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172b40 0,#0b1220 55%);color:var(--text);font:16px/1.5 Arial,Helvetica,sans-serif}
header{padding:28px 18px 22px;text-align:center;border-bottom:1px solid var(--line);background:#0b1220cc}
.logo{font-weight:900;letter-spacing:3px;font-size:clamp(25px,5vw,42px)}.logo span{color:var(--accent2)}
header p{color:var(--muted);margin:7px 0 0}.wrap{max-width:980px;margin:25px auto;padding:0 16px}
.notice{background:#122b31;border:1px solid #24544f;color:#bcebe3;padding:12px 15px;border-radius:12px;margin-bottom:20px;font-size:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px;font-weight:700}
button.active,button:hover{border-color:var(--accent);background:#173a40}
.category{margin:22px 0}.category h2{font-size:15px;letter-spacing:1.5px;color:var(--accent2);margin:0 0 10px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(145deg,var(--panel),#111b2b);border:1px solid var(--line);border-radius:12px;padding:14px}
.item strong{display:block;font-size:15px}.item small{display:block;color:var(--muted);margin-top:3px}
.item a{white-space:nowrap;text-decoration:none;background:#17675f;color:white;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:700}
.item a:hover{background:#21877c}.empty{display:none;color:var(--muted);text-align:center;padding:35px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 12px}
@media(max-width:480px){.item{align-items:flex-start}.item a{padding:7px 9px}}
</style>
</head>
<body>
<header>
  <div class="logo">LUCX<span>HUB</span></div>
  <p>Centro de recursos y proyectos para PlayStation 3</p>
</header>
<main class="wrap">
  <div class="notice">Repositorio personal de recursos. Revisá siempre el origen y la compatibilidad de los archivos antes de instalarlos.</div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar aplicaciones, mods, XML..." aria-label="Buscar recursos">
    <button class="filter active" data-filter="all">Todo</button>
    <button class="filter" data-filter="apps">Apps</button>
    <button class="filter" data-filter="mods">Mods</button>
    <button class="filter" data-filter="tools">Herramientas</button>
  </div>
  <div id="catalog"></div>
  <div id="empty" class="empty">No se encontraron recursos.</div>
</main>
<footer> LUCXHUB · Proyecto independiente · No afiliado a Sony </footer>
<script>
// EDITÁ ESTA LISTA PARA AGREGAR TUS PROPIOS RECURSOS.
// Reemplazá "#" por el enlace público del archivo o de la página.
const resources = [
 {category:"apps",title:"webMAN MOD",description:"Página oficial del proyecto",url:"#"},
 {category:"apps",title:"MultiMAN",description:"Información y recursos",url:"#"},
 {category:"mods",title:"Mods de GTA San Andreas",description:"Colección personal de modificaciones",url:"#"},
 {category:"mods",title:"Mods de WWE 2K17",description:"Proyectos y contenido personalizado",url:"#"},
 {category:"tools",title:"Archivos XML",description:"Plantillas para organizar tu XMB",url:"#"},
 {category:"tools",title:"Portadas e imágenes",description:"Recursos gráficos para tus proyectos",url:"#"}
];
const labels={apps:"APLICACIONES",mods:"MODS Y PERSONALIZACIONES",tools:"HERRAMIENTAS Y RECURSOS"};
const catalog=document.getElementById("catalog"),search=document.getElementById("search"),empty=document.getElementById("empty");
let active="all";
function render(){
 catalog.innerHTML="";
 const q=search.value.toLowerCase().trim();
 let shown=0;
 Object.keys(labels).forEach(cat=>{
  const matches=resources.filter(r=>r.category===cat&&(active==="all"||active===cat)&&(`${r.title} ${r.description}`).toLowerCase().includes(q));
  if(!matches.length)return;
  shown+=matches.length;
  const section=document.createElement("section");section.className="category";
  const h=document.createElement("h2");h.textContent=labels[cat];section.appendChild(h);
  const grid=document.createElement("div");grid.className="items";
  matches.forEach(r=>{
   const card=document.createElement("article");card.className="item";
   const info=document.createElement("div");
   const title=document.createElement("strong");title.textContent=r.title;
   const desc=document.createElement("small");desc.textContent=r.description;
   info.append(title,desc);
   const link=document.createElement("a");link.href=r.url;link.textContent="ABRIR";
   if(r.url==="#"){link.addEventListener("click",e=>{e.preventDefault();alert("Agregá el enlace de este recurso en la lista resources del archivo index.html.");});}
   else{link.target="_blank";link.rel="noopener noreferrer";}
   card.append(info,link);grid.appendChild(card);
  });
  section.appendChild(grid);catalog.appendChild(section);
 });
 empty.style.display=shown?"none":"block";
}
document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");active=btn.dataset.filter;render();
}));
search.addEventListener("input",render);render();
</script>
</body>
</html>
