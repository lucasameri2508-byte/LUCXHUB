
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCXHUB | PS3 Store</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080c14;
    color: #f1f5f9;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: linear-gradient(135deg, #101d32, #07101d);
    padding: 25px 15px;
    border-bottom: 2px solid #00aaff;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    color: #00aaff;
}

.logo span {
    color: white;
}

.subtitle {
    color: #9baec4;
    margin-top: 8px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.search {
    width: 100%;
    padding: 15px;
    border-radius: 8px;
    background: #111b2b;
    color: white;
    border: 1px solid #253952;
    font-size: 16px;
    outline: none;
}

.search:focus {
    border-color: #00aaff;
}

.categories {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 15px 0;
}

.category {
    padding: 10px 15px;
    border-radius: 6px;
    border: 1px solid #26374e;
    background: #111b2b;
    color: white;
    cursor: pointer;
}

.category.active,
.category:hover {
    background: #007ac2;
    border-color: #00aaff;
}

.status {
    color: #91a4bc;
    margin: 15px 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.card {
    background: #111b2b;
    border: 1px solid #24354b;
    border-radius: 10px;
    padding: 17px;
    transition: 0.2s;
}

.card:hover {
    border-color: #00aaff;
    transform: translateY(-2px);
}

.file-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.file-name {
    font-weight: bold;
    font-size: 16px;
    word-break: break-word;
    margin-bottom: 10px;
}

.file-info {
    color: #91a4bc;
    font-size: 13px;
    margin-bottom: 14px;
}

.download {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #007ac2;
    color: white;
    font-weight: bold;
    padding: 12px;
    border-radius: 7px;
}

.download:hover {
    background: #009de8;
}

.empty {
    text-align: center;
    padding: 40px;
    color: #91a4bc;
    grid-column: 1 / -1;
}

.refresh {
    padding: 10px 15px;
    background: #18263a;
    color: white;
    border: 1px solid #30445d;
    border-radius: 6px;
    cursor: pointer;
}

.refresh:hover {
    background: #263b57;
}

footer {
    text-align: center;
    color: #72839a;
    padding: 30px 15px;
    border-top: 1px solid #172436;
    margin-top: 35px;
}

</style>
</head>

<body>

<header>
    <div class="logo">LUCX<span>HUB</span></div>
    <div class="subtitle">PlayStation 3 · Downloads · Homebrew</div>
</header>

<div class="container">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Buscar archivos..."
    >

    <div class="categories">
        <button class="category active" data-category="all">Todos</button>
        <button class="category" data-category="pkg">PKG</button>
        <button class="category" data-category="zip">ZIP</button>
        <button class="category" data-category="rap">RAP</button>
        <button class="category" data-category="other">Otros</button>
    </div>

    <button class="refresh" onclick="loadFiles()">
        ↻ Actualizar archivos
    </button>

    <div id="status" class="status">
        Cargando archivos...
    </div>

    <div id="files" class="grid"></div>

</div>

<footer>
    LUCXHUB · PS3 STORE<br>
    Archivos disponibles desde el repositorio
</footer>

<script>

const OWNER = "lucasameri2508-byte";
const REPO = "LUCXHUB";
const BRANCH = "main";
const FOLDER = "Files";

let allFiles = [];
let currentCategory = "all";

function getExtension(name) {
    let parts = name.split(".");
    return parts.length > 1
        ? parts.pop().toLowerCase()
        : "";
}

function getCategory(file) {
    let ext = getExtension(file.name);

    if (ext === "pkg") return "pkg";
    if (ext === "zip") return "zip";
    if (ext === "rap") return "rap";

    return "other";
}

function getIcon(file) {
    let ext = getExtension(file.name);

    if (ext === "pkg") return "📦";
    if (ext === "zip" || ext === "rar" || ext === "7z")
        return "🗜";

    if (ext === "rap") return "🔑";
    if (ext === "txt") return "📄";

    return "📁";
}

function formatSize(bytes) {
    if (bytes < 1024)
        return bytes + " B";

    if (bytes < 1048576)
        return (bytes / 1024).toFixed(2) + " KB";

    if (bytes < 1073741824)
        return (bytes / 1048576).toFixed(2) + " MB";

    return (bytes / 1073741824).toFixed(2) + " GB";
}

function loadFiles() {

    let status = document.getElementById("status");
    let container = document.getElementById("files");

    status.innerHTML = "Buscando archivos en GitHub...";
    container.innerHTML = "";

    let url =
        "https://api.github.com/repos/" +
        OWNER + "/" + REPO +
        "/contents/" + FOLDER +
        "?ref=" + BRANCH;

    let xhr = new XMLHttpRequest();

    xhr.open("GET", url, true);

    xhr.onload = function() {

        if (xhr.status !== 200) {
            status.innerHTML =
                "No se pudieron cargar los archivos. " +
                "Verificá que exista la carpeta Files.";
            return;
        }

        let data;

        try {
            data = JSON.parse(xhr.responseText);
        } catch (e) {
            status.innerHTML = "Error leyendo los archivos.";
            return;
        }

        allFiles = [];

        for (let i = 0; i < data.length; i++) {

            let file = data[i];

            if (file.type !== "file")
                continue;

            allFiles.push({
                name: file.name,
                size: file.size,
                download:
                    "https://raw.githubusercontent.com/" +
                    OWNER + "/" + REPO + "/" +
                    BRANCH + "/" + FOLDER + "/" +
                    encodeURIComponent(file.name)
            });
        }

        status.innerHTML =
            allFiles.length +
            " archivo(s) encontrados.";

        renderFiles();
    };

    xhr.onerror = function() {
        status.innerHTML =
            "Error de conexión. Intentá actualizar.";
    };

    xhr.send();
}

function renderFiles() {

    let container = document.getElementById("files");
    let search = document.getElementById("search")
        .value.toLowerCase();

    container.innerHTML = "";

    let count = 0;

    for (let i = 0; i < allFiles.length; i++) {

        let file = allFiles[i];
        let category = getCategory(file);

        if (
            currentCategory !== "all" &&
            currentCategory !== category
        ) {
            continue;
        }

        if (
            file.name.toLowerCase().indexOf(search) === -1
        ) {
            continue;
        }

        count++;

        let card = document.createElement("div");
        card.className = "card";

        let icon = document.createElement("div");
        icon.className = "file-icon";
        icon.textContent = getIcon(file);

        let name = document.createElement("div");
        name.className = "file-name";
        name.textContent = file.name;

        let info = document.createElement("div");
        info.className = "file-info";
        info.textContent =
            category.toUpperCase() +
            " · " +
            formatSize(file.size);

        let link = document.createElement("a");
        link.className = "download";
        link.textContent = "DESCARGAR";
        link.href = file.download;
        link.setAttribute("download", file.name);

        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(info);
        card.appendChild(link);

        container.appendChild(card);
    }

    if (count === 0) {
        container.innerHTML =
            '<div class="empty">No se encontraron archivos.</div>';
    }
}

document.getElementById("search")
    .addEventListener("keyup", renderFiles);

let buttons = document.getElementsByClassName("category");

for (let i = 0; i < buttons.length; i++) {

    buttons[i].onclick = function() {

        for (let j = 0; j < buttons.length; j++) {
            buttons[j].className = "category";
        }

        this.className = "category active";

        currentCategory =
            this.getAttribute("data-category");

        renderFiles();
    };
}

loadFiles();

</script>

</body>
</html>
