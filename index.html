
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101020">
<title>LUCXHUB | PS3</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(ellipse at top, #29204d 0%, #101020 55%, #080812 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 35px 15px 25px;
    background: linear-gradient(135deg, #ff3195, #813bdb, #00d9ff);
    border-bottom: 4px solid #ff70c0;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow: 3px 3px #17112c;
}

.subtitle {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: bold;
}

.container {
    width: 94%;
    max-width: 1200px;
    margin: 25px auto;
}

.panel {
    background: rgba(25, 25, 48, 0.95);
    border: 1px solid #563d85;
    border-radius: 12px;
    padding: 17px;
    margin-bottom: 20px;
    box-shadow: 0 0 18px rgba(140, 60, 255, 0.15);
}

.search {
    width: 100%;
    padding: 14px;
    background: #111122;
    color: white;
    border: 2px solid #7044b8;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

.search:focus {
    border-color: #00d9ff;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 14px;
}

.filter {
    padding: 10px 17px;
    background: #29213e;
    color: white;
    border: 1px solid #7146a9;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.filter.active,
.filter:hover {
    background: #ed3297;
    border-color: #ff8bc9;
}

.status {
    text-align: center;
    color: #00eaff;
    font-size: 13px;
    margin-top: 15px;
    min-height: 18px;
}

.section-title {
    font-size: 21px;
    font-weight: 900;
    color: #ff64b4;
    margin: 25px 0 15px;
    text-shadow: 0 0 10px #a42b85;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
}

.card {
    background: linear-gradient(145deg, #24213b, #121225);
    border: 1px solid #513c78;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s;
    min-width: 0;
}

.card:hover {
    border-color: #00d9ff;
    box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
    transform: translateY(-3px);
}

.cover {
    width: 100%;
    height: 155px;
    object-fit: contain;
    background: #0d0d1c;
    display: block;
    padding: 8px;
}

.no-cover {
    width: 100%;
    height: 155px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #34204c, #101020);
    font-size: 45px;
}

.card-content {
    padding: 13px;
}

.name {
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
    min-height: 38px;
}

.info {
    font-size: 12px;
    color: #b8b8d0;
    margin: 9px 0 12px;
}

.download {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px 5px;
    background: linear-gradient(90deg, #ed3297, #853bd4);
    color: white;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
    border-radius: 7px;
}

.download:hover {
    background: linear-gradient(90deg, #00bfe9, #4266e9);
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #aaa;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    color: #777;
    padding: 30px 10px;
    font-size: 12px;
}

@media(max-width: 450px) {
    .logo {
        font-size: 30px;
    }

    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .cover,
    .no-cover {
        height: 120px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">LUCXHUB</div>
    <div class="subtitle">PLAYSTATION 3 • GAMING STORE</div>
</header>

<div class="container">

    <div class="panel">
        <input
            class="search"
            type="text"
            id="search"
            placeholder="Buscar juegos, aplicaciones, archivos..."
        >

        <div class="filters">
            <button class="filter active" data-filter="all">TODOS</button>
            <button class="filter" data-filter="pkg">PKG</button>
            <button class="filter" data-filter="zip">ZIP</button>
            <button class="filter" data-filter="rap">RAP</button>
            <button class="filter" data-filter="other">OTROS</button>
        </div>

        <div class="status" id="status">Cargando LUCXHUB...</div>
    </div>

    <div class="section-title">▸ BIBLIOTECA LUCXHUB</div>

    <div class="grid" id="grid">
        <div class="empty">Cargando archivos...</div>
    </div>

</div>

<footer>
    LUCXHUB © 2026 · PLAYSTATION 3
</footer>

<script>
/* =================================
   CONFIGURACIÓN
================================= */

var OWNER = "lucasameri2508-byte";
var REPO = "LUCXHUB";
var BRANCH = "main";

var FILES_FOLDER = "Files";
var LINKS_FOLDER = "LINKS";
var ICONS_FOLDER = "ICONS";

var allFiles = [];
var currentFilter = "all";
var currentSearch = "";

/* =================================
   FUNCIONES GENERALES
================================= */

function apiFolder(folder) {
    return "https://api.github.com/repos/" +
        OWNER + "/" + REPO +
        "/contents/" + folder +
        "?ref=" + BRANCH;
}

function baseName(filename) {
    return filename.replace(/\.[^/.]+$/, "");
}

function getCategory(filename) {
    var extension = filename.split(".").pop().toLowerCase();

    if (extension === "pkg") return "pkg";
    if (extension === "zip") return "zip";
    if (extension === "rap") return "rap";

    return "other";
}

function formatSize(bytes) {
    if (!bytes || bytes <= 0) return "Tamaño desconocido";

    var units = ["B", "KB", "MB", "GB"];
    var i = 0;

    while (bytes >= 1024 && i < 3) {
        bytes /= 1024;
        i++;
    }

    return bytes.toFixed(2) + " " + units[i];
}

function showStatus(message) {
    document.getElementById("status").textContent = message;
}

/* =================================
   CARGAR ARCHIVOS DE FILES
================================= */

function loadFiles(callback) {
    var xhr = new XMLHttpRequest();

    xhr.open("GET", apiFolder(FILES_FOLDER), true);

    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;

        if (xhr.status === 200) {
            try {
                var files = JSON.parse(xhr.responseText);

                files.forEach(function(file) {
                    if (file.type !== "file") return;

                    allFiles.push({
                        name: file.name,
                        displayName: baseName(file.name),
                        size: file.size,
                        sizeLabel: null,
                        download: file.download_url,
                        key: baseName(file.name).toLowerCase(),
                        external: false,
                        category: getCategory(file.name)
                    });
                });

            } catch (e) {
                console.log("Error cargando Files:", e);
            }
        }

        callback();
    };

    xhr.onerror = function() {
        callback();
    };

    xhr.send();
}

/* =================================
   CARGAR ENLACES TXT DE LINKS
================================= */

function loadLinks(callback) {
    var xhr = new XMLHttpRequest();

    xhr.open("GET", apiFolder(LINKS_FOLDER), true);

    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;

        if (xhr.status !== 200) {
            callback();
            return;
        }

        var files;

        try {
            files = JSON.parse(xhr.responseText);
        } catch (e) {
            callback();
            return;
        }

        var txtFiles = files.filter(function(file) {
            return file.type === "file" &&
                /\.txt$/i.test(file.name);
        });

        if (txtFiles.length === 0) {
            callback();
            return;
        }

        var completed = 0;

        function finishOne() {
            completed++;

            if (completed === txtFiles.length) {
                callback();
            }
        }

        txtFiles.forEach(function(file) {
            var txt = new XMLHttpRequest();

            txt.open("GET", file.download_url, true);

            txt.onreadystatechange = function() {
                if (txt.readyState !== 4) return;

                if (txt.status === 200) {
                    var link = txt.responseText.trim();

                    if (/^https?:\/\/\S+$/i.test(link)) {
                        var filename = file.name.replace(/\.txt$/i, "");
                        var category = getCategory(filename);

                        var displayName = filename.replace(
                            /\.(pkg|zip|rap)$/i,
                            ""
                        );

                        allFiles.push({
                            name: filename,
                            displayName: displayName,
                            size: 0,
                            sizeLabel: "Descarga externa · MediaFire",
                            download: link,
                            key: displayName.toLowerCase(),
                            external: true,
                            category: category
                        });
                    }
                }

                finishOne();
            };

            txt.onerror = finishOne;

            txt.send();
        });
    };

    xhr.onerror = function() {
        callback();
    };

    xhr.send();
}

/* =================================
   CARGAR ICONOS
================================= */

var iconMap = {};

function loadIcons(callback) {
    var xhr = new XMLHttpRequest();

    xhr.open("GET", apiFolder(ICONS_FOLDER), true);

    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;

        if (xhr.status === 200) {
            try {
                var icons = JSON.parse(xhr.responseText);

                icons.forEach(function(icon) {
                    if (icon.type !== "file") return;

                    if (!/\.(png|jpg|jpeg|webp|gif)$/i.test(icon.name)) {
                        return;
                    }

                    var key = baseName(icon.name).toLowerCase();

                    iconMap[key] = icon.download_url;
                });

            } catch (e) {
                console.log("Error cargando ICONS:", e);
            }
        }

        callback();
    };

    xhr.onerror = function() {
        callback();
    };

    xhr.send();
}

/* =================================
   RENDERIZAR TARJETAS
================================= */

function renderFiles() {
    var grid = document.getElementById("grid");

    grid.innerHTML = "";

    var filtered = allFiles.filter(function(file) {
        var matchesFilter =
            currentFilter === "all" ||
            file.category === currentFilter;

        var searchText = (
            file.displayName + " " + file.name
        ).toLowerCase();

        var matchesSearch =
            searchText.indexOf(currentSearch) !== -1;

        return matchesFilter && matchesSearch;
    });

    if (filtered.length === 0) {
        grid.innerHTML =
            '<div class="empty">No se encontraron archivos.</div>';
        return;
    }

    filtered.forEach(function(file) {
        var card = document.createElement("div");
        card.className = "card";

        var iconKey = file.key;
        var iconUrl = iconMap[iconKey];

        if (!iconUrl) {
            iconKey = baseName(file.name).toLowerCase();
            iconUrl = iconMap[iconKey];
        }

        if (iconUrl) {
            var image = document.createElement("img");
            image.className = "cover";
            image.src = iconUrl;
            image.alt = file.displayName;

            image.onerror = function() {
                var fallback = document.createElement("div");
                fallback.className = "no-cover";
                fallback.textContent = "🎮";
                image.parentNode.replaceChild(fallback, image);
            };

            card.appendChild(image);
        } else {
            var noCover = document.createElement("div");
            noCover.className = "no-cover";
            noCover.textContent = "🎮";
            card.appendChild(noCover);
        }

        var content = document.createElement("div");
        content.className = "card-content";

        var name = document.createElement("div");
        name.className = "name";
        name.textContent = file.displayName || file.name;

        var info = document.createElement("div");
        info.className = "info";
        info.textContent =
            file.sizeLabel || formatSize(file.size);

        var link = document.createElement("a");
        link.className = "download";
        link.href = file.download;

        if (file.external) {
            link.textContent = "↗ ABRIR MEDIAFIRE";
        } else {
            link.textContent = "⬇ DESCARGAR";
            link.setAttribute("download", file.name);
        }

        content.appendChild(name);
        content.appendChild(info);
        content.appendChild(link);

        card.appendChild(content);
        grid.appendChild(card);
    });
}

/* =================================
   BUSCADOR
================================= */

document.getElementById("search").oninput = function() {
    currentSearch = this.value.toLowerCase();
    renderFiles();
};

/* =================================
   FILTROS
================================= */

var buttons = document.querySelectorAll(".filter");

for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function() {
        currentFilter = this.getAttribute("data-filter");

        for (var j = 0; j < buttons.length; j++) {
            buttons[j].className = "filter";
        }

        this.className = "filter active";

        renderFiles();
    };
}

/* =================================
   INICIAR LUCXHUB
================================= */

function startStore() {
    showStatus("Cargando archivos de GitHub...");

    loadFiles(function() {

        loadLinks(function() {

            loadIcons(function() {

                renderFiles();

                showStatus(
                    "✓ " + allFiles.length +
                    " archivos cargados correctamente"
                );

            });

        });

    });
}

startStore();

</script>

</body>
</html>
